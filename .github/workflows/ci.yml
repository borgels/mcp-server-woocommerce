name: CI

on:
  pull_request:
  # Pushes to main run this workflow through publish.yml, tags through release.yml.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    name: test (Node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  server-json:
    runs-on: ubuntu-latest
    env:
      # Pinned; bumped by hand together with release.yml.
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Check server.json matches package.json
        run: |
          node -e '
            const pkg = require("./package.json");
            const srv = require("./server.json");
            const npm = srv.packages.find((p) => p.registryType === "npm") ?? {};
            const checks = [
              ["package.json mcpName", pkg.mcpName, srv.name],
              ["server.json version", srv.version, pkg.version],
              ["npm package identifier", npm.identifier, pkg.name],
              ["npm package version", npm.version, pkg.version],
            ];
            const bad = checks.filter(([, actual, expected]) => actual !== expected);
            for (const [what, actual, expected] of bad) console.error(`::error::${what} is ${actual}, expected ${expected}`);
            process.exit(bad.length ? 1 : 0);
          '
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$RUNNER_TEMP/$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$RUNNER_TEMP/$archive"
          tar xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" mcp-publisher
      # Checks the schema and the registry's semantic rules.
      - name: Validate server.json
        run: '"$RUNNER_TEMP/mcp-publisher" validate server.json'

  image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
# template:start
# Removed by scripts/rename.mjs. The rename script must produce a working server.

  rename:
    runs-on: ubuntu-latest
    env:
      # Pinned; bumped by hand together with release.yml.
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: A conflicting target path stops the rename before any write
        run: |
          touch src/tools/acme.ts
          if node scripts/rename.mjs acme; then exit 1; fi
          rm src/tools/acme.ts
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Publish guard is not ready before the rename
        run: |
          test "$(sh .github/scripts/placeholder-ready.sh)" = ready=false
          # The placeholder package name alone also keeps it not ready.
          mv scripts/rename.mjs "$RUNNER_TEMP/rename.mjs"
          test "$(sh .github/scripts/placeholder-ready.sh)" = ready=false
          mv "$RUNNER_TEMP/rename.mjs" scripts/rename.mjs
      - run: node scripts/rename.mjs myexample MY_EXAMPLE
      - name: Script, CI job and placeholder are gone
        run: |
          test ! -e scripts/rename.mjs
          if grep -n 'template:start' .github/workflows/ci.yml README.md; then
            echo '::error::template-only block left after rename'
            exit 1
          fi
          if grep -rn --exclude-dir=.git 'npm-package' .; then
            echo '::error::package placeholder left after rename'
            exit 1
          fi
          # Every remaining "example" must be part of the new name or of .env.example.
          if grep -rniP --exclude-dir=.git --exclude=LICENSE '(?<!my)(?<!my_)(?<!\.env\.)example' .; then
            echo '::error::placeholder text left after rename'
            exit 1
          fi
      - name: Second run fails clearly
        run: |
          git checkout -- scripts/rename.mjs
          if node scripts/rename.mjs again; then exit 1; fi
          rm scripts/rename.mjs
      - name: Publish guard is ready after the rename
        run: test "$(sh .github/scripts/placeholder-ready.sh)" = ready=true
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$RUNNER_TEMP/$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$RUNNER_TEMP/$archive"
          tar xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" mcp-publisher
      - name: Validate the renamed server.json
        run: '"$RUNNER_TEMP/mcp-publisher" validate server.json'
# template:end
