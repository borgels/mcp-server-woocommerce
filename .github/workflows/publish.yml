name: Publish image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  # Weekly rebuild of main without the layer cache, so fixes in the node:24-alpine
  # base image land even when the code has not changed.
  schedule:
    - cron: "0 3 * * 1"   # Monday 03:00 UTC

permissions:
  contents: read

# One publish per ref at a time, so two quick pushes cannot race `latest`.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  # Nothing is published from the template repository, or while the
  # placeholder server is still present (see .github/scripts/placeholder-ready.sh).
  guard:
    if: github.repository != 'borgels/mcp-server-template'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        run: |
          result="$(sh .github/scripts/placeholder-ready.sh)"
          if [ "$result" != "ready=true" ]; then
            echo "::warning::The placeholder server has not been renamed; no image is published."
          fi
          echo "$result" >> "$GITHUB_OUTPUT"

  publish:
    needs: [test, guard]
    if: >-
      needs.guard.outputs.ready == 'true' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Image names must be lower case; owner and repository names may not be.
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', steps.image.outputs.name) || '' }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:{1}', steps.image.outputs.name, github.sha) || '' }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('{0}:{1}', steps.image.outputs.name, github.ref_name) || '' }}
