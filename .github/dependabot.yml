version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript majors need a matching tsup release (declaration build); update by hand.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      # One PR for all non-major updates, so a lockfile fix that touches several
      # packages can pass `npm audit` in a single run.
      npm-minor-and-patch:
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
